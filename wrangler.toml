name = "magic-screen"
main = "worker/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "magic-screen-db"
database_id = "f77997dc-42a3-49dd-8f56-28592df550ae"

[triggers]
crons = ["17 22 * * MON-FRI", "47 22 * * MON-FRI", "*/10 * * * *"]

[vars]
APP_ENV = "production"
