name = "magic-screen"
main = "worker/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "magic-screen-db"
database_id = "f77997dc-42a3-49dd-8f56-28592df550ae"
migrations_dir = "migrations"

[ai]
binding = "AI"

[[routes]]
pattern = "investlah.binalah.com"
custom_domain = true

[vars]
APP_ENV = "production"
RP_NAME = "Magic Folio"
RP_ID = "investlah.binalah.com"
RP_ORIGIN = "https://investlah.binalah.com"
# Set a descriptive SEC User-Agent with a real contact email before enabling filings.
# SEC_USER_AGENT = "Magic Folio/0.1 (contact: your-real-email@domain.com)"
# Set the public VAPID values after generating a key pair. Keep the private key in Worker secrets only.
# VAPID_PUBLIC_KEY = "base64url-public-key"
# VAPID_SUBJECT = "mailto:your-real-email@domain.com"

[triggers]
crons = ["0 1 * * 1-5", "0 2 * * 5"]
