name = "magic-screen"
main = "worker/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "magic-screen-db"
database_id = "f77997dc-42a3-49dd-8f56-28592df550ae"
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
APP_ENV = "production"
RP_NAME = "Magic Folio"
# Set these to the final production hostname before enabling passkey registration.
# RP_ID = "magic-screen.example.workers.dev"
# RP_ORIGIN = "https://magic-screen.example.workers.dev"
# Set a descriptive SEC User-Agent with a real contact email before enabling filings.
# SEC_USER_AGENT = "Magic Folio/0.1 (contact: your-email@example.com)"
