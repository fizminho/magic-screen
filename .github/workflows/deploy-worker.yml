name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magic-folio-production-cutover
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Verify production WebAuthn relying-party configuration
        shell: bash
        run: |
          set -euo pipefail
          RP_ID="$(sed -n 's/^RP_ID = "\([^"]*\)"/\1/p' wrangler.toml)"
          RP_ORIGIN="$(sed -n 's/^RP_ORIGIN = "\([^"]*\)"/\1/p' wrangler.toml)"
          test -n "$RP_ID" || { echo "::error::Set RP_ID in wrangler.toml before production deployment."; exit 1; }
          test "$RP_ORIGIN" = "https://$RP_ID" || { echo "::error::Set RP_ORIGIN to the exact HTTPS origin matching RP_ID."; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Report available dependency updates
        run: npm outdated || true
      - name: Build application and Worker
        run: npm run build
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Apply pending non-destructive D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply magic-screen-db --remote
      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4 deploy
      - name: Verify live Worker health
        shell: bash
        run: |
          set -euo pipefail
          RP_ORIGIN="$(sed -n 's/^RP_ORIGIN = "\([^"]*\)"/\1/p' wrangler.toml)"
          curl --fail --silent --show-error "$RP_ORIGIN/api/health" | jq -e '.ok == true and .service == "magic-folio"'
