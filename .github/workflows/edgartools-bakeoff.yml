name: EdgarTools fundamentals bakeoff

on:
  push:
    branches: [main]
    paths:
      - "scripts/edgartools_bakeoff.py"
      - ".github/workflows/edgartools-bakeoff.yml"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers from the current MFI universe (default runs the HRB/PBI/ADBE controls plus seven current MFI sample issuers)"
        required: false
        default: "HRB,PBI,ADBE,AFMJF,HPQ,OTEX,PRDO,PLTK,UPWK,SNDK"
        type: string

permissions:
  contents: read

concurrency:
  group: edgartools-bakeoff
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EdgarTools
        run: python -m pip install --upgrade pip "edgartools==6.3.0"
      - name: Extract selected company statements
        env:
          EDGAR_IDENTITY: "Magic Screen research support@binalah.co"
          OUTPUT_PATH: "edgartools-bakeoff.json"
          BAKEOFF_SYMBOLS: "${{ github.event.inputs.symbols || 'HRB,PBI,ADBE,AFMJF,HPQ,OTEX,PRDO,PLTK,UPWK,SNDK' }}"
        run: python scripts/edgartools_bakeoff.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgartools-bakeoff
          path: edgartools-bakeoff.json
          if-no-files-found: warn
          retention-days: 7
