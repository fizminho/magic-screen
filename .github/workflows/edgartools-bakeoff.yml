name: EdgarTools fundamentals bakeoff

on:
  push:
    branches: [main]
    paths:
      - "scripts/edgartools_bakeoff.py"
      - "scripts/test_edgartools_bakeoff.py"
      - "scripts/build_accounting_review_queue.py"
      - "scripts/test_accounting_review_queue.py"
      - "scripts/validate_mfi_ranking_preview.py"
      - "scripts/test_validate_mfi_ranking_preview.py"
      - "scripts/validate_mfi_universe_coverage.py"
      - "scripts/test_validate_mfi_universe_coverage.py"
      - "scripts/validate_edgartools_pipeline.py"
      - "scripts/test_validate_edgartools_pipeline.py"
      - "scripts/prepare_mfi_market_caps.py"
      - "scripts/test_prepare_mfi_market_caps.py"
      - "docs/US_MFI_COMPLETION_PLAN.md"
      - "README.md"
      - "worker/index.ts"
      - "worker/filing-specific-ebit.ts"
      - "worker/filing-specific-ebit.test.mjs"
      - "src/App.tsx"
      - "src/styles.css"
      - ".github/workflows/edgartools-bakeoff.yml"
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma-separated ticker override. Leave blank to fetch the active US MFI universe and append ADBE as a regression control."
        required: false
        default: ""
        type: string
      mfi_price_date:
        description: "Optional MFI market-price date. Blank uses the active universe's matching quote date."
        required: false
        default: ""
        type: string
      # INTENTIONAL: a custom quote date requires a matching complete market-cap map.
      market_caps_json:
        description: "Optional complete ticker-to-market-cap map in USD millions. Blank uses the refreshed active-universe snapshot or the pinned regression snapshot."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: edgartools-bakeoff
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EdgarTools
        run: python -m pip install --upgrade pip "edgartools==6.3.0"
      - name: Run accounting candidate regression tests
        run: |
          python -m unittest discover -s scripts -p "test_edgartools_bakeoff.py" -v
          python -m unittest discover -s scripts -p "test_accounting_review_queue.py" -v
          node --experimental-strip-types --test worker/filing-specific-ebit.test.mjs
          python -m unittest discover -s scripts -p "test_validate_mfi_universe_coverage.py" -v
          python -m unittest discover -s scripts -p "test_build_mfi_sensitivity_report.py" -v
      - name: Resolve active MFI universe
        id: universe
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.symbols == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-universe]'))
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
          REQUESTED_MFI_PRICE_DATE: "${{ github.event.inputs.mfi_price_date || '' }}"
          HAS_CUSTOM_MARKET_CAPS: "${{ github.event.inputs.market_caps_json != '' }}"
        run: |
          if [ -z "$EDGARTOOLS_INGEST_URL" ] || [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::error::EDGARTOOLS_INGEST_URL and UNIVERSE_SYNC_TOKEN are required for dynamic universe discovery."
            exit 1
          fi
          BASE_URL="${EDGARTOOLS_INGEST_URL%/api/fundamentals/edgartools/ingest}"
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            "$BASE_URL/api/fundamentals/edgartools/universe" > edgartools-universe.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          report = json.loads(Path("edgartools-universe.json").read_text())
          symbols = report.get("symbols")
          if report.get("primary_provider") != "EdgarTools" or report.get("market") != "US":
              raise SystemExit("Universe response is not the active US EdgarTools universe.")
          if not isinstance(symbols, list) or not symbols:
              raise SystemExit("The Worker returned an empty or invalid active MFI universe.")
          if report.get("count") != len(symbols):
              raise SystemExit("Universe count does not match the returned symbol list.")
          if len(symbols) != len(set(symbols)):
              raise SystemExit("Universe contains duplicate symbols.")
          if any(not isinstance(symbol, str) or not re.fullmatch(r"[A-Z0-9.-]{1,15}", symbol) for symbol in symbols):
              raise SystemExit("Universe contains an invalid ticker.")
          print(f"Validated {len(symbols)} unique active US MFI symbols.")
          PY
          CUSTOM_CAPS_ARGS=()
          if [ "$HAS_CUSTOM_MARKET_CAPS" = "true" ]; then CUSTOM_CAPS_ARGS+=(--has-custom-market-caps); fi
          python scripts/prepare_mfi_market_caps.py \
            --universe edgartools-universe.json \
            --output edgartools-market-cap-inputs.json \
            --github-output "$GITHUB_OUTPUT" \
            --requested-price-date "$REQUESTED_MFI_PRICE_DATE" \
            "${CUSTOM_CAPS_ARGS[@]}"
          SYMBOLS=$(python -c 'import json; d=json.load(open("edgartools-universe.json")); s=d["symbols"]; print(",".join(s + (["ADBE"] if "ADBE" not in s else [])))')
          if [ -z "$SYMBOLS" ]; then
            echo "::error::The Worker returned an empty active MFI universe."
            exit 1
          fi
          echo "symbols=$SYMBOLS" >> "$GITHUB_OUTPUT"
          echo "Resolved $(echo "$SYMBOLS" | awk -F, '{print NF}') symbols from active US MFI universe (including ADBE regression control when absent)."
      - name: Extract selected company statements
        env:
          EDGAR_IDENTITY: "Magic Screen research support@binalah.co"
          OUTPUT_PATH: "edgartools-bakeoff.json"
          BAKEOFF_SYMBOLS: "${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[full-universe]')) && 'ADBE,ALEC,AFMJF,BCRX,BMBL,EGHSF,FHTX,HRB,HRMY,HPQ,IRWD,MGTX,MNTN,NRIX,OTEX,PRDO,PXED,PBI,PLTK,QTTB,RGS,SNDK,SBC,SSTK,SPRO,STRA,SGHC,UPWK,VXRT,ZVRA,GTM' || (github.event.inputs.symbols != '' && github.event.inputs.symbols || steps.universe.outputs.symbols) }}"
          MFI_PRICE_DATE: "${{ github.event.inputs.mfi_price_date || steps.universe.outputs.price_date || '2026-11-18' }}"
          MFI_MARKET_CAPS_JSON: "${{ github.event.inputs.market_caps_json || steps.universe.outputs.market_caps_json || '' }}"
          MFI_MARKET_CAPS_SOURCE: "${{ github.event.inputs.market_caps_json != '' && 'workflow_override' || (steps.universe.outputs.market_caps_json != '' && 'active_universe_snapshot' || 'pinned_regression_snapshot') }}"
          MFI_MARKET_CAP_SNAPSHOT_AS_OF: "${{ steps.universe.outputs.snapshot_as_of || '' }}"
          MFI_QUARTER_DATE: "${{ steps.universe.outputs.quarter_date || '2026-09-30' }}"
        run: |
          python scripts/edgartools_bakeoff.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("edgartools-bakeoff.json").read_text())
          requested = {symbol.strip().upper() for symbol in os.environ["BAKEOFF_SYMBOLS"].split(",") if symbol.strip()}
          companies = report.get("companies", [])
          actual = [str(company.get("symbol", "")).upper() for company in companies]
          if report.get("primary_provider") != "EdgarTools" or report.get("production_data_modified") is not False:
              raise SystemExit("Extraction report failed provider or production-immutability checks.")
          if report.get("mfi_price_date") != (report.get("mfi_market_cap_snapshot") or {}).get("price_date"):
              raise SystemExit("Market-cap snapshot date does not match the FX quote date.")
          if len(actual) != len(set(actual)) or set(actual) != requested:
              raise SystemExit(f"Extraction coverage mismatch: requested={len(requested)}, returned={len(actual)}.")
          allowed = {"supported", "unsupported_provider", "extraction_error"}
          for company in companies:
              status = company.get("provider_status")
              if status not in allowed:
                  raise SystemExit(f"{company.get('symbol')}: invalid provider status {status!r}.")
              if status == "supported":
                  filing = company.get("filing") or {}
                  if not (filing.get("accession_number") or filing.get("accession")) or not (filing.get("period_of_report") or filing.get("period")):
                      raise SystemExit(f"{company.get('symbol')}: supported extraction is missing accession/period.")
          print(f"Validated extraction coverage for all {len(actual)} requested symbols.")
          PY
      # Pushes remain regression-only unless the commit message explicitly contains
      # [full-universe]. Scheduled/manual/full-universe runs post raw evidence after discovery.
      - name: Ingest EdgarTools filing evidence (raw, no ranking changes)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-universe]'))) && vars.EDGARTOOLS_INGEST_URL != ''
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
        run: |
          if [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::warning::UNIVERSE_SYNC_TOKEN is not configured; report remains artifact-only."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @edgartools-bakeoff.json \
            "$EDGARTOOLS_INGEST_URL" > edgartools-ingest-response.json
          python - <<'PY'
          import json
          from pathlib import Path
          extraction = json.loads(Path("edgartools-bakeoff.json").read_text())
          response = json.loads(Path("edgartools-ingest-response.json").read_text())
          expected = len(extraction.get("companies", []))
          unsupported = sorted(company["symbol"] for company in extraction["companies"] if company.get("provider_status") == "unsupported_provider")
          if response.get("received") != expected or response.get("ingested") != expected:
              raise SystemExit(f"Raw evidence ingestion incomplete: expected={expected}, received={response.get('received')}, ingested={response.get('ingested')}.")
          if sorted(response.get("unsupported_provider", [])) != unsupported:
              raise SystemExit("Ingestion unsupported-provider coverage does not match extraction report.")
          if response.get("production_fundamentals_changed") is not False or response.get("rankings_changed") is not False:
              raise SystemExit("Ingestion did not confirm production immutability.")
          print(f"Validated raw ingestion: {response['ingested']} / {expected} company records accepted; unsupported={len(unsupported)}.")
          PY
      - name: Run read-only accounting resolver preview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && vars.EDGARTOOLS_INGEST_URL != ''
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
        run: |
          if [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::warning::UNIVERSE_SYNC_TOKEN is not configured; resolver preview skipped."
            exit 0
          fi
          BASE_URL="${EDGARTOOLS_INGEST_URL%/api/fundamentals/edgartools/ingest}"
          set +x
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 300 --max-time 120 \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            "$BASE_URL/api/fundamentals/edgartools/resolve-preview" > edgartools-resolver-preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("edgartools-resolver-preview.json").read_text())
          summary = report.get("summary", {})
          print("Read-only resolver preview summary:")
          for key, value in summary.items():
              print(f"  {key}: {value}")
          if report.get("production_fundamentals_changed") is not False or report.get("rankings_changed") is not False:
              raise SystemExit("Resolver preview did not confirm production and ranking immutability.")
          print(f"Resolver: {report.get('resolver')}; rows: {len(report.get('resolutions', []))}")
          universe_path = Path("edgartools-universe.json")
          if universe_path.exists():
              universe = json.loads(universe_path.read_text())
              if summary.get("active_universe") != universe.get("count"):
                  raise SystemExit("Resolver active-universe count does not match the refreshed MFI universe.")
              if summary.get("awaiting_evidence") != 0:
                  raise SystemExit("Some active-universe companies are still missing EdgarTools evidence after ingestion.")
              if summary.get("supported", 0) + summary.get("unsupported_provider", 0) != summary.get("active_universe"):
                  raise SystemExit("Resolver provider coverage does not reconcile to the active universe.")
          else:
              print("Regression-only run: skipping dynamic-universe coverage assertions.")
          PY
      - name: Run read-only MFI ranking preview
        if: hashFiles('edgartools-resolver-preview.json') != '' && vars.EDGARTOOLS_INGEST_URL != ''
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
        run: |
          if [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::warning::UNIVERSE_SYNC_TOKEN is not configured; ranking preview skipped."
            exit 0
          fi
          BASE_URL="${EDGARTOOLS_INGEST_URL%/api/fundamentals/edgartools/ingest}"
          set +x
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 300 --max-time 120 \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            "$BASE_URL/api/fundamentals/edgartools/ranking-preview" > edgartools-mfi-ranking-preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("edgartools-mfi-ranking-preview.json").read_text())
          print("Shadow MFI ranking summary:", report.get("summary", {}))
          if report.get("production_fundamentals_changed") is not False or report.get("rankings_changed") is not False or report.get("production_write") is not False:
              raise SystemExit("Ranking preview did not confirm production immutability.")
          print("Preview-only ranking rows:", len(report.get("rankings", [])))
          PY
      - name: Validate US MFI ranking policy and coverage
        if: always() && hashFiles('edgartools-mfi-ranking-preview.json') != ''
        run: |
          python -m unittest discover -s scripts -p "test_validate_mfi_ranking_preview.py" -v
          python scripts/validate_mfi_ranking_preview.py edgartools-mfi-ranking-preview.json
      - name: Validate full-universe extraction and ingestion
        if: always() && hashFiles('edgartools-universe.json') != '' && hashFiles('edgartools-bakeoff.json') != '' && hashFiles('edgartools-ingest-response.json') != '' && hashFiles('edgartools-resolver-preview.json') != '' && hashFiles('edgartools-mfi-ranking-preview.json') != ''
        run: |
          python scripts/validate_edgartools_pipeline.py \
            --universe edgartools-universe.json \
            --market-cap-inputs edgartools-market-cap-inputs.json \
            --extraction edgartools-bakeoff.json \
            --ingestion edgartools-ingest-response.json \
            --resolver edgartools-resolver-preview.json \
            --ranking edgartools-mfi-ranking-preview.json
      - name: Validate full US MFI universe coverage
        if: always() && hashFiles('edgartools-universe.json') != '' && hashFiles('edgartools-resolver-preview.json') != '' && hashFiles('edgartools-mfi-ranking-preview.json') != ''
        run: python scripts/validate_mfi_universe_coverage.py --universe edgartools-universe.json --extraction edgartools-bakeoff.json --resolver edgartools-resolver-preview.json --ranking edgartools-mfi-ranking-preview.json
      - name: Build accounting exception queue
        if: always() && hashFiles('edgartools-resolver-preview.json') != ''
        run: python scripts/build_accounting_review_queue.py
      - name: Build top-cohort ranking sensitivity report
        if: always() && hashFiles('edgartools-mfi-ranking-preview.json') != '' && hashFiles('accounting-review-queue.json') != ''
        run: python scripts/build_mfi_sensitivity_report.py
      - name: Validate issuer debt-note review guardrails
        if: always() && hashFiles('accounting-review-queue.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          queue = json.loads(Path("accounting-review-queue.json").read_text())
          reviews = [
              item["filing_debt_note_review"]
              for item in queue.get("items", [])
              if item.get("filing_debt_note_review")
          ]
          expected = queue.get("summary", {}).get("filing_debt_note_manual_reviews_available")
          if expected != len(reviews):
              raise SystemExit(f"Debt-note review summary mismatch: summary={expected}, rows={len(reviews)}")
          for review in reviews:
              if review.get("status") != "review_only":
                  raise SystemExit("A curated debt-note review is not marked review_only.")
              if review.get("production_approved") is not False:
                  raise SystemExit("A curated debt-note review is production-approved.")
              if review.get("resolver_input") is not False:
                  raise SystemExit("A curated debt-note review entered resolver inputs.")
              if review.get("debt_candidate_promoted") is not False:
                  raise SystemExit("A curated debt-note review promoted a debt candidate.")
              for field in ("evidence_scope", "manual_review_questions", "prohibited_inferences"):
                  if not review.get(field):
                      raise SystemExit(f"Curated debt-note review missing {field}.")
          if queue.get("production_write") is not False:
              raise SystemExit("Accounting review queue does not confirm production_write=false.")
          print(f"Validated {len(reviews)} accession-bound debt-note reviews; no resolver or production promotion.")
          PY
      - name: Upload test and resolver reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgartools-bakeoff
          path: |
            edgartools-universe.json
            edgartools-market-cap-inputs.json
            edgartools-bakeoff.json
            edgartools-ingest-response.json
            edgartools-resolver-preview.json
            accounting-review-queue.json
            accounting-review-queue.csv
            edgartools-mfi-ranking-preview.json
            mfi-ranking-sensitivity.json
            mfi-ranking-sensitivity.md
          if-no-files-found: warn
          retention-days: 7
