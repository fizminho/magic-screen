name: EdgarTools fundamentals bakeoff

on:
  push:
    branches: [main]
    paths:
      - "scripts/edgartools_bakeoff.py"
      - "scripts/test_edgartools_bakeoff.py"
      - "scripts/build_accounting_review_queue.py"
      - "scripts/test_accounting_review_queue.py"
      - ".github/workflows/edgartools-bakeoff.yml"
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma-separated ticker override. Leave blank to fetch the active US MFI universe and append ADBE as a regression control."
        required: false
        default: ""
        type: string
      mfi_price_date:
        description: "MFI market-price date used to align the historical USD-to-reporting-currency FX rate"
        required: false
        default: "2026-11-18"
        type: string
      # INTENTIONAL: changing the quote date without a matching market-cap map
      # causes the script to withhold the pinned market caps rather than reuse stale values.
      market_caps_json:
        description: "Optional JSON object of ticker to MFI market cap in USD millions; blank uses the pinned 2026-11-20 snapshot"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: edgartools-bakeoff
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EdgarTools
        run: python -m pip install --upgrade pip "edgartools==6.3.0"
      - name: Run accounting candidate regression tests
        run: |
          python -m unittest discover -s scripts -p "test_edgartools_bakeoff.py" -v
          python -m unittest discover -s scripts -p "test_accounting_review_queue.py" -v
      - name: Resolve active MFI universe
        id: universe
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.symbols == '')
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
        run: |
          if [ -z "$EDGARTOOLS_INGEST_URL" ] || [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::error::EDGARTOOLS_INGEST_URL and UNIVERSE_SYNC_TOKEN are required for dynamic universe discovery."
            exit 1
          fi
          BASE_URL="${EDGARTOOLS_INGEST_URL%/api/fundamentals/edgartools/ingest}"
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            "$BASE_URL/api/fundamentals/edgartools/universe" > edgartools-universe.json
          SYMBOLS=$(python -c 'import json; d=json.load(open("edgartools-universe.json")); s=d.get("symbols", []); print(",".join(s + (["ADBE"] if "ADBE" not in s else [])))')
          if [ -z "$SYMBOLS" ]; then
            echo "::error::The Worker returned an empty active MFI universe."
            exit 1
          fi
          echo "symbols=$SYMBOLS" >> "$GITHUB_OUTPUT"
          echo "Resolved $(echo "$SYMBOLS" | awk -F, '{print NF}') symbols from active US MFI universe (including ADBE regression control when absent)."
      - name: Extract selected company statements
        env:
          EDGAR_IDENTITY: "Magic Screen research support@binalah.co"
          OUTPUT_PATH: "edgartools-bakeoff.json"
          BAKEOFF_SYMBOLS: "${{ github.event_name == 'push' && 'ADBE,ALEC,AFMJF,BCRX,BMBL,EGHSF,FHTX,HRB,HRMY,HPQ,IRWD,MGTX,MNTN,NRIX,OTEX,PRDO,PXED,PBI,PLTK,QTTB,RGS,SNDK,SBC,SSTK,SPRO,STRA,SGHC,UPWK,VXRT,ZVRA,GTM' || (github.event.inputs.symbols != '' && github.event.inputs.symbols || steps.universe.outputs.symbols) }}"
          MFI_PRICE_DATE: "${{ github.event.inputs.mfi_price_date || '2026-11-18' }}"
          MFI_MARKET_CAPS_JSON: "${{ github.event.inputs.market_caps_json || '' }}"
        run: python scripts/edgartools_bakeoff.py
      # INTENTIONAL: push-based runs are regression-only. Scheduled and manual runs
      # post raw EdgarTools evidence after dynamic universe discovery.
      - name: Ingest EdgarTools filing evidence (raw, no ranking changes)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && vars.EDGARTOOLS_INGEST_URL != ''
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
        run: |
          if [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::warning::UNIVERSE_SYNC_TOKEN is not configured; report remains artifact-only."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @edgartools-bakeoff.json \
            "$EDGARTOOLS_INGEST_URL"
      - name: Run read-only accounting resolver preview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && vars.EDGARTOOLS_INGEST_URL != ''
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
        run: |
          if [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::warning::UNIVERSE_SYNC_TOKEN is not configured; resolver preview skipped."
            exit 0
          fi
          BASE_URL="${EDGARTOOLS_INGEST_URL%/api/fundamentals/edgartools/ingest}"
          set +x
          curl --fail-with-body --silent --show-error --retry 3 --max-time 120 \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            "$BASE_URL/api/fundamentals/edgartools/resolve-preview" > edgartools-resolver-preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("edgartools-resolver-preview.json").read_text())
          summary = report.get("summary", {})
          print("Read-only resolver preview summary:")
          for key, value in summary.items():
              print(f"  {key}: {value}")
          if report.get("production_fundamentals_changed") is not False or report.get("rankings_changed") is not False:
              raise SystemExit("Resolver preview did not confirm production and ranking immutability.")
          print(f"Resolver: {report.get('resolver')}; rows: {len(report.get('resolutions', []))}")
          PY
      - name: Run read-only MFI ranking preview
        if: hashFiles('edgartools-resolver-preview.json') != '' && vars.EDGARTOOLS_INGEST_URL != ''
        env:
          EDGARTOOLS_INGEST_URL: "${{ vars.EDGARTOOLS_INGEST_URL }}"
          UNIVERSE_SYNC_TOKEN: "${{ secrets.UNIVERSE_SYNC_TOKEN }}"
        run: |
          if [ -z "$UNIVERSE_SYNC_TOKEN" ]; then
            echo "::warning::UNIVERSE_SYNC_TOKEN is not configured; ranking preview skipped."
            exit 0
          fi
          BASE_URL="${EDGARTOOLS_INGEST_URL%/api/fundamentals/edgartools/ingest}"
          set +x
          curl --fail-with-body --silent --show-error --retry 3 --max-time 120 \
            -H "Authorization: Bearer $UNIVERSE_SYNC_TOKEN" \
            "$BASE_URL/api/fundamentals/edgartools/ranking-preview" > edgartools-mfi-ranking-preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("edgartools-mfi-ranking-preview.json").read_text())
          print("Shadow MFI ranking summary:", report.get("summary", {}))
          if report.get("production_fundamentals_changed") is not False or report.get("rankings_changed") is not False or report.get("production_write") is not False:
              raise SystemExit("Ranking preview did not confirm production immutability.")
          print("Preview-only ranking rows:", len(report.get("rankings", [])))
          PY
      - name: Build accounting exception queue
        if: always() && hashFiles('edgartools-resolver-preview.json') != ''
        run: python scripts/build_accounting_review_queue.py
      - name: Upload test and resolver reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgartools-bakeoff
          path: |
            edgartools-bakeoff.json
            edgartools-resolver-preview.json
            accounting-review-queue.json
            accounting-review-queue.csv
            edgartools-mfi-ranking-preview.json
          if-no-files-found: warn
          retention-days: 7
