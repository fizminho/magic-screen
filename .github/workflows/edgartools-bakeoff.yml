name: EdgarTools fundamentals bakeoff

on:
  push:
    branches: [main]
    paths:
      - "scripts/edgartools_bakeoff.py"
      - "scripts/test_edgartools_bakeoff.py"
      - ".github/workflows/edgartools-bakeoff.yml"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers from the current MFI universe (default runs the latest full 30-stock MFI snapshot plus ADBE as a historical control)"
        required: false
        default: "ADBE,ALEC,AFMJF,BCRX,BMBL,EGHSF,FHTX,HRB,HRMY,HPQ,IRWD,MGTX,MNTN,NRIX,OTEX,PRDO,PXED,PBI,PLTK,QTTB,RGS,SNDK,SBC,SSTK,SPRO,STRA,SGHC,UPWK,VXRT,ZVRA,GTM"
        type: string
      mfi_price_date:
        description: "MFI market-price date used to align the historical USD-to-reporting-currency FX rate"
        required: false
        default: "2026-11-18"
        type: string
      # INTENTIONAL: changing the quote date without a matching market-cap map
      # causes the script to withhold the pinned market caps rather than reuse stale values.
      market_caps_json:
        description: "Optional JSON object of ticker to MFI market cap in USD millions; blank uses the pinned 2026-11-20 snapshot"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: edgartools-bakeoff
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EdgarTools
        run: python -m pip install --upgrade pip "edgartools==6.3.0"
      - name: Run balance-sheet candidate regression tests
        run: python -m unittest discover -s scripts -p "test_edgartools_bakeoff.py" -v
      - name: Extract selected company statements
        env:
          EDGAR_IDENTITY: "Magic Screen research support@binalah.co"
          OUTPUT_PATH: "edgartools-bakeoff.json"
          BAKEOFF_SYMBOLS: "${{ github.event.inputs.symbols || 'ADBE,ALEC,AFMJF,BCRX,BMBL,EGHSF,FHTX,HRB,HRMY,HPQ,IRWD,MGTX,MNTN,NRIX,OTEX,PRDO,PXED,PBI,PLTK,QTTB,RGS,SNDK,SBC,SSTK,SPRO,STRA,SGHC,UPWK,VXRT,ZVRA,GTM' }}"
          MFI_PRICE_DATE: "${{ github.event.inputs.mfi_price_date || '2026-11-18' }}"
          MFI_MARKET_CAPS_JSON: '${{ github.event.inputs.market_caps_json || '' }}'
        run: python scripts/edgartools_bakeoff.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgartools-bakeoff
          path: edgartools-bakeoff.json
          if-no-files-found: warn
          retention-days: 7
