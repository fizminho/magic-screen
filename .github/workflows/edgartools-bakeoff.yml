name: EdgarTools fundamentals bakeoff

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgartools-bakeoff
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install EdgarTools
        run: python -m pip install --upgrade pip edgartools
      - name: Extract HRB, PBI and ADBE statements
        env:
          EDGAR_IDENTITY: "Magic Screen research support@binalah.co"
          OUTPUT_PATH: "edgartools-bakeoff.json"
        run: python scripts/edgartools_bakeoff.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgartools-bakeoff
          path: edgartools-bakeoff.json
          if-no-files-found: warn
          retention-days: 7
