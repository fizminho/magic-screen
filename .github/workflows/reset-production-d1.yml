name: One-time production D1 reset and cutover

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: Type DROP-ALL-LEGACY-DATA to permanently erase all user tables in magic-screen-db
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: magic-folio-production-cutover
  cancel-in-progress: false

jobs:
  reset-and-deploy:
    if: inputs.confirm_reset == 'DROP-ALL-LEGACY-DATA' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_PRODUCTION_RESET: ${{ inputs.confirm_reset }}
      D1_DATABASE_NAME: magic-screen-db
      D1_SCOPE: --remote
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify credentials, production RP config and legacy removal
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$D1_SCOPE" = "--remote"
          if grep -Eqi '/api/mfi/screen|/api/stocks|/api/pipeline/status|MFI_SESSION_COOKIE|syncMagicFormulaUniverse' worker/index.ts; then
            echo "::error::Refusing production reset: legacy MFI Worker code is still present."
            exit 1
          fi
          test -f migrations/0002_portfolio_schema.sql
          RP_ID="$(sed -n 's/^RP_ID = "\([^"]*\)"/\1/p' wrangler.toml)"
          RP_ORIGIN="$(sed -n 's/^RP_ORIGIN = "\([^"]*\)"/\1/p' wrangler.toml)"
          test -n "$RP_ID"
          test "$RP_ORIGIN" = "https://$RP_ID"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Build replacement application
        run: npm run build
      - name: Run regression suite
        run: node --experimental-strip-types --test worker/*.test.mjs
      - name: Validate Wrangler bundling and assets without deploying
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Confirm temporary setup secret exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list > /tmp/worker-secrets.json
          jq -e 'any(.[]; .name == "SETUP_TOKEN")' /tmp/worker-secrets.json >/dev/null
      - name: Reset all production D1 user tables and apply clean schema
        run: bash scripts/reset-production-d1.sh
      - name: Deploy the replacement Worker and assets
        run: npx --yes wrangler@4 deploy
      - name: Verify live Worker health
        shell: bash
        run: |
          set -euo pipefail
          RP_ORIGIN="$(sed -n 's/^RP_ORIGIN = "\([^"]*\)"/\1/p' wrangler.toml)"
          curl --fail --silent --show-error "$RP_ORIGIN/api/health" | jq -e '.ok == true and .service == "magic-folio"'
