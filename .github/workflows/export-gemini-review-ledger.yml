name: Export Gemini review audit ledger

# Read-only audit export. No Gemini calls, decisions, production writes or ranking changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-gemini-review-ledger.yml"
      - "scripts/export_gemini_review_ledger.mjs"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: gemini-review-ledger-export
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ledger-export]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export persistent review history and decisions
        env:
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL || 'https://magic-screen.96muhdhafiz.workers.dev' }}
          UNIVERSE_SYNC_TOKEN: ${{ secrets.UNIVERSE_SYNC_TOKEN }}
        run: node scripts/export_gemini_review_ledger.mjs
      - name: Upload audit export
        uses: actions/upload-artifact@v4
        with:
          name: gemini-review-ledger-${{ github.run_id }}
          path: artifacts/review-ledger-export.*
          if-no-files-found: error
          retention-days: 14
