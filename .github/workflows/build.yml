name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Audit production dependencies (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Run complete Node regression suite
        run: node --experimental-strip-types --test worker/*.test.mjs
      # INTENTIONAL: validate Wrangler bundling and asset configuration without deploying.
      - run: npx wrangler deploy --dry-run
