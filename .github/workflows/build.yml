name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Run Gemini accounting review contract and deduplication tests
        run: node --test worker/gemini-accounting-review*.test.mjs
      - name: Run US universe source-membership tests
        run: node --test worker/universe-membership.test.mjs
      - name: Run Gemini batch orchestration and ranking tests
        run: node --test worker/gemini-batch.test.mjs worker/mfi-ranking.test.mjs
      - name: Run debt reconciliation regression tests
        run: node --test worker/debt-reconciliation.test.mjs
      - name: Run lease and ROU coverage regression tests
        run: node --test scripts/test_build_lease_rou_coverage_report.mjs
      - name: Run US MFI policy sensitivity regression tests
        run: |
          python3 -m py_compile scripts/build_mfi_sensitivity_report.py
          python3 -m unittest discover -s scripts -p "test_build_mfi_sensitivity_report.py" -v
      - name: Validate EdgarTools test script syntax
        run: python3 -m py_compile scripts/edgartools_bakeoff.py
      # INTENTIONAL: validate Wrangler bundling and asset configuration without deploying.
      - run: npx wrangler deploy --dry-run
