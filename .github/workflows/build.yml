name: Build
on:
  push:
    branches: [main, chore/ai-portfolio-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Report available dependency updates
        run: npm outdated || true
      - run: npm run build
      - name: Audit all dependencies (blocking)
        run: npm audit --audit-level=high
      - name: Run complete Node regression suite
        run: node --experimental-strip-types --test worker/*.test.mjs
      - name: Validate Wrangler bundling and asset configuration without deploying
        run: npx wrangler deploy --dry-run
