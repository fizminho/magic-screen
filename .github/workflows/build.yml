name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Run Gemini accounting review contract and deduplication tests
        run: node --test worker/gemini-accounting-review*.test.mjs
      - name: Run lease and ROU coverage regression tests
        run: node --test scripts/test_build_lease_rou_coverage_report.mjs
      - name: Validate EdgarTools test script syntax
        run: python3 -m py_compile scripts/edgartools_bakeoff.py
      # INTENTIONAL: validate Wrangler bundling and asset configuration without deploying.
      - run: npx wrangler deploy --dry-run
