name: Build
on:
  push:
    branches: [main, chore/ai-portfolio-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Report available dependency updates
        run: npm outdated || true
      - run: npm run build
      - name: Audit all dependencies (blocking)
        run: npm audit --audit-level=high
      - name: Run complete Node regression suite
        run: node --experimental-strip-types --test worker/*.test.mjs
      - name: Validate Wrangler bundling and asset configuration without deploying
        run: npx wrangler deploy --dry-run
