name: Phase A - Repository baseline

on:
  push:
    branches:
      - chore/ai-portfolio-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Install, build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288ca8ca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies (baseline; lockfile not yet present)
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Run complete Node regression suite
        run: node --experimental-strip-types --test worker/*.test.mjs
