name: Phase A - Repository baseline

on:
  push:
    branches:
      - chore/ai-portfolio-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Install, build, audit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --no-audit --no-fund
      - name: Report available dependency updates
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm outdated || true
      - name: Build
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run build
      - name: Audit production dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high
      - name: Run complete Node regression suite
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: node --experimental-strip-types --test worker/*.test.mjs
      - name: Validate Wrangler bundling and assets without deploying
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 deploy --dry-run
