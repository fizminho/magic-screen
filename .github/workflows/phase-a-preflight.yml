name: Phase A - Repository baseline

on:
  push:
    branches:
      - chore/ai-portfolio-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Install, build, audit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --no-audit --no-fund
      - name: Report available dependency updates
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm outdated || true
      - name: Build
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run build
      - name: Audit all dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high
      - name: Run complete Node regression suite
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: node --experimental-strip-types --test worker/*.test.mjs
      - name: Apply D1 migrations to a fresh local database
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 d1 migrations apply magic-screen-db --local
      - name: Verify local D1 schema
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 d1 execute magic-screen-db --local --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
      - name: Verify CIK and SEC cache schema
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 d1 execute magic-screen-db --local --command "SELECT cik FROM instrument LIMIT 0; SELECT cik FROM sec_fetch_cache LIMIT 0; SELECT cik FROM sec_filing LIMIT 0; SELECT facts_json FROM sec_companyfacts_cache LIMIT 0;"
      - name: Verify SEC rate-limit kind is accepted by D1
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 d1 execute magic-screen-db --local --command "INSERT INTO auth_attempt(ip_hash,window,kind,count) VALUES('ci-sec-rate-limit',strftime('%Y-%m-%dT%H','now'),'sec_fetch',1); DELETE FROM auth_attempt WHERE ip_hash='ci-sec-rate-limit';"
      - name: Exercise the destructive reset routine against local D1 only
        if: ${{ hashFiles('package-lock.json') != '' }}
        env:
          CONFIRM_PRODUCTION_RESET: DROP-ALL-LEGACY-DATA
          D1_SCOPE: --local
        run: bash scripts/reset-production-d1.sh
      - name: Smoke-test Worker auth routes with local D1
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp .dev.vars.example .dev.vars
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/magic-folio-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          health=""
          for attempt in {1..30}; do
            health="$(curl --silent --show-error --fail --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/health 2>/dev/null || true)"
            if [[ -n "$health" ]]; then break; fi
            sleep 1
          done
          if [[ -z "$health" ]]; then
            cat /tmp/magic-folio-wrangler.log
            exit 1
          fi
          echo "$health" | jq -e '.ok == true and .service == "magic-folio"'
          state="$(curl --silent --show-error --fail --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/auth/state)"
          echo "$state" | jq -e '.needsSetup == true and .authenticated == false'
          register_status="$(curl --silent --output /tmp/register-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X POST http://localhost:8787/api/auth/register/options -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' --data '{}')"
          test "$register_status" = "403"
          login_status="$(curl --silent --output /tmp/login-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X POST http://localhost:8787/api/auth/login/options -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' --data '{}')"
          test "$login_status" = "403"
          private_status="$(curl --silent --output /tmp/credentials-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/auth/credentials)"
          test "$private_status" = "401"
          sec_facts_private_status="$(curl --silent --output /tmp/sec-facts-private.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 'http://localhost:8787/api/sec/companyfacts?symbol=AAPL')"
          test "$sec_facts_private_status" = "401"
          # Seed two synthetic owner passkeys and active sessions to verify that
          # deleting one passkey revokes only its own sessions and preserves the last passkey.
          target_token="$(openssl rand -hex 32)"
          backup_token="$(openssl rand -hex 32)"
          target_hash="$(printf '%s' "$target_token" | sha256sum | awk '{print $1}')"
          backup_hash="$(printf '%s' "$backup_token" | sha256sum | awk '{print $1}')"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          expires="$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%S.000Z)"
          npx --yes wrangler@4 d1 execute magic-screen-db --local --command "
            INSERT INTO passkey_credential(id,public_key,algorithm,name,created_at) VALUES
              ('ci-passkey-revoke-target','ci-public-key',-7,'CI target','$now'),
              ('ci-passkey-revoke-backup','ci-public-key',-7,'CI backup','$now');
            INSERT INTO session(token_hash,credential_id,created_at,expires_at,last_seen_at,user_agent) VALUES
              ('$target_hash','ci-passkey-revoke-target','$now','$expires','$now','CI'),
              ('$backup_hash','ci-passkey-revoke-backup','$now','$expires','$now','CI');
          "
          revoke_status="$(curl --silent --output /tmp/revoke-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X DELETE http://localhost:8787/api/auth/credentials/ci-passkey-revoke-target -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' -H "Cookie: magicfolio_session=$target_token" --data '{}')"
          test "$revoke_status" = "200"
          jq -e '.ok == true and .passkeyCount == 1' /tmp/revoke-response.json >/dev/null
          remaining_target="$(npx --yes wrangler@4 d1 execute magic-screen-db --local --json --command "SELECT COUNT(*) AS remaining FROM session WHERE token_hash='$target_hash';" | jq -r '.. | objects | select(has("remaining")) | .remaining' | head -n 1)"
          test "$remaining_target" = "0"
          backup_sessions="$(npx --yes wrangler@4 d1 execute magic-screen-db --local --json --command "SELECT COUNT(*) AS remaining FROM session WHERE token_hash='$backup_hash';" | jq -r '.. | objects | select(has("remaining")) | .remaining' | head -n 1)"
          test "$backup_sessions" = "1"
          last_key_status="$(curl --silent --output /tmp/last-passkey-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X DELETE http://localhost:8787/api/auth/credentials/ci-passkey-revoke-backup -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' -H "Cookie: magicfolio_session=$backup_token" --data '{}')"
          test "$last_key_status" = "409"
          jq -e '.error == "The last passkey cannot be deleted."' /tmp/last-passkey-response.json >/dev/null
          # Exercise real D1 holdings upsert, list and delete using the remaining owner session.
          holdings_status="$(curl --silent --output /tmp/holdings-put.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X PUT http://localhost:8787/api/holdings -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' -H "Cookie: magicfolio_session=$backup_token" --data '{"holdings":[{"symbol":"AAPL","market":"US","quantity":2,"avgCost":100,"cik":"320193"},{"symbol":"1155","market":"MY","quantity":50,"avgCost":6.2}]}')"
          test "$holdings_status" = "200"
          jq -e '.saved == 2' /tmp/holdings-put.json >/dev/null
          holdings_get_status="$(curl --silent --output /tmp/holdings-get.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/holdings -H "Cookie: magicfolio_session=$backup_token")"
          test "$holdings_get_status" = "200"
          jq -e '.holdings | length == 2' /tmp/holdings-get.json >/dev/null
          quote_asof="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          quote_payload="$(jq -n --arg asOf "$quote_asof" '{quotes:[{symbol:"AAPL",market:"US",price:101,prevClose:100,changePct:0.01,asOf:$asOf,currency:"USD",provider:"marketdata.app",status:"ok"},{symbol:"1155",market:"MY",price:6.42,prevClose:6.3,changePct:0.0190476,asOf:$asOf,currency:"MYR",provider:"manual-csv",status:"ok"}]}')"
          quote_status="$(curl --silent --output /tmp/quotes-post.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X POST http://localhost:8787/api/quotes/snapshots -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' -H "Cookie: magicfolio_session=$backup_token" --data "$quote_payload")"
          test "$quote_status" = "200"
          jq -e '.saved == 2 and (.unmatchedSymbols | length == 0)' /tmp/quotes-post.json >/dev/null
          holdings_after_quote="$(curl --silent --show-error --fail --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/holdings -H "Cookie: magicfolio_session=$backup_token")"
          echo "$holdings_after_quote" | jq -e '.holdings[] | select(.symbol == "AAPL") | .price == 101 and .quoteStatus == "ok"' >/dev/null
          dashboard_status="$(curl --silent --output /tmp/dashboard.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/dashboard -H "Cookie: magicfolio_session=$backup_token")"
          test "$dashboard_status" = "200"
          jq -e '.holdingsCount == 2 and (.markets[] | select(.market == "US") | .marketValue == 202 and .currency == "USD" and .dayChangeValue == 2 and .dayChangePct == 1) and (.markets[] | select(.market == "MY") | .marketValue == 321 and .currency == "MYR" and .dayChangeValue == 6 and .dayChangePct == 1.9)' /tmp/dashboard.json >/dev/null
          sec_fetched_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          npx --yes wrangler@4 d1 execute magic-screen-db --local --command "
            INSERT INTO sec_fetch_cache(instrument_id,cik,fetched_at,company_name,filing_count)
              SELECT id,'0000320193','$sec_fetched_at','Apple Inc.',1 FROM instrument WHERE market='US' AND symbol='AAPL';
            INSERT INTO sec_filing(accession_number,cik,instrument_id,form,title,summary,filing_date,report_date,primary_document,url,fetched_at)
              SELECT '0000320193-26-000001','0000320193',id,'10-Q','AAPL 10-Q','Quarterly report.','2026-11-24','2026-09-30','aapl.htm','https://www.sec.gov/Archives/edgar/data/320193/000032019326000001/aapl.htm','$sec_fetched_at'
              FROM instrument WHERE market='US' AND symbol='AAPL';
            INSERT INTO sec_companyfacts_cache(instrument_id,cik,fetched_at,facts_json)
              SELECT id,'0000320193','$sec_fetched_at','{}'
              FROM instrument WHERE market='US' AND symbol='AAPL';
          "
          holding_delete_status="$(curl --silent --output /tmp/holding-delete.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X DELETE http://localhost:8787/api/holdings/US/AAPL -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' -H "Cookie: magicfolio_session=$backup_token" --data '{}')"
          echo "holding delete HTTP status: $holding_delete_status"
          cat /tmp/holding-delete.json
          if [[ "$holding_delete_status" != "200" ]]; then
            echo "Worker log around holding deletion:"
            tail -n 100 /tmp/magic-folio-wrangler.log
            exit 1
          fi
          jq -e '.deleted == true and .symbol == "AAPL"' /tmp/holding-delete.json >/dev/null
          check_local_cleanup() {
            local label="$1"
            local sql="$2"
            local output=""
            local stderr_file="/tmp/wrangler-d1-cleanup.stderr"
            local attempt=1
            while (( attempt <= 3 )); do
              : > "$stderr_file"
              if output="$(npx --yes wrangler@4 d1 execute magic-screen-db --local --json --command "$sql" 2>"$stderr_file")"; then
                echo "$label cleanup result:"
                if ! echo "$output" | jq .; then
                  echo "::error::$label cleanup returned invalid JSON."
                  cat "$stderr_file"
                  return 1
                fi
                if echo "$output" | jq -e '.. | objects | select(.status? == "clean")' >/dev/null; then
                  return 0
                fi
                echo "::error::$label cache cleanup did not return clean."
                return 1
              fi
              echo "::warning::$label cleanup query failed on attempt $attempt:"
              cat "$stderr_file"
              echo "$output"
              sleep 1
              ((attempt += 1))
            done
            echo "::error::$label cleanup query failed after 3 attempts."
            return 1
          }
          check_local_cleanup "SEC filing" "SELECT CASE WHEN EXISTS(SELECT 1 FROM sec_filing WHERE cik='0000320193') THEN 'not-clean' ELSE 'clean' END AS status;"
          check_local_cleanup "SEC fetch" "SELECT CASE WHEN EXISTS(SELECT 1 FROM sec_fetch_cache WHERE cik='0000320193') THEN 'not-clean' ELSE 'clean' END AS status;"
          check_local_cleanup "SEC companyfacts" "SELECT CASE WHEN EXISTS(SELECT 1 FROM sec_companyfacts_cache WHERE cik='0000320193') THEN 'not-clean' ELSE 'clean' END AS status;"
          check_local_cleanup "Quote" "SELECT CASE WHEN EXISTS(SELECT 1 FROM quote_latest q JOIN instrument i ON i.id=q.instrument_id WHERE i.symbol='AAPL') THEN 'not-clean' ELSE 'clean' END AS status;"
          watchlist_status="$(curl --silent --output /tmp/watchlist-post.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X POST http://localhost:8787/api/watchlist -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' -H "Cookie: magicfolio_session=$backup_token" --data '{"items":[{"symbol":"MSFT","market":"US","note":"CI watchlist"}]}')"
          echo "watchlist POST HTTP status: $watchlist_status"
          cat /tmp/watchlist-post.json
          test "$watchlist_status" = "200"
          jq -e '.added == 1' /tmp/watchlist-post.json >/dev/null
          watchlist_get_status="$(curl --silent --output /tmp/watchlist-get.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/watchlist -H "Cookie: magicfolio_session=$backup_token")"
          echo "watchlist GET HTTP status: $watchlist_get_status"
          cat /tmp/watchlist-get.json
          test "$watchlist_get_status" = "200"
          jq -e '.items | length == 1 and .[0].symbol == "MSFT"' /tmp/watchlist-get.json >/dev/null
          export_json_status="$(curl --silent --output /tmp/export.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/export?format=json -H "Cookie: magicfolio_session=$backup_token")"
          echo "JSON export HTTP status: $export_json_status"
          test "$export_json_status" = "200"
          jq -e '.holdings | length == 1 and .[0].symbol == "1155"' /tmp/export.json >/dev/null
          jq -e '.watchlist | length == 1' /tmp/export.json >/dev/null
          export_csv_status="$(curl --silent --output /tmp/export.csv --dump-header /tmp/export-headers --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/export?format=csv -H "Cookie: magicfolio_session=$backup_token")"
          echo "CSV export HTTP status: $export_csv_status"
          test "$export_csv_status" = "200"
          grep -qi '^content-type: text/csv' /tmp/export-headers
          grep -q '^record_type,symbol,market' /tmp/export.csv
          grep -q '1155' /tmp/export.csv
          watchlist_delete_status="$(curl --silent --output /tmp/watchlist-delete.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X DELETE http://localhost:8787/api/watchlist/US/MSFT -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' -H "Cookie: magicfolio_session=$backup_token" --data '{}')"
          echo "watchlist delete HTTP status: $watchlist_delete_status"
          cat /tmp/watchlist-delete.json
          test "$watchlist_delete_status" = "200"
          jq -e '.deleted == true and .symbol == "MSFT"' /tmp/watchlist-delete.json >/dev/null
      - name: Validate Wrangler bundling and assets without deploying
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 deploy --dry-run
