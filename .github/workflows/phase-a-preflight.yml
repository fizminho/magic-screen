name: Phase A - Repository baseline

on:
  push:
    branches:
      - chore/ai-portfolio-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Install, build, audit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --no-audit --no-fund
      - name: Report available dependency updates
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm outdated || true
      - name: Build
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run build
      - name: Audit all dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high
      - name: Run complete Node regression suite
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: node --experimental-strip-types --test worker/*.test.mjs
      - name: Apply D1 migrations to a fresh local database
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 d1 migrations apply magic-screen-db --local
      - name: Verify local D1 schema
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 d1 execute magic-screen-db --local --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
      - name: Exercise the destructive reset routine against local D1 only
        if: ${{ hashFiles('package-lock.json') != '' }}
        env:
          CONFIRM_PRODUCTION_RESET: DROP-ALL-LEGACY-DATA
          D1_SCOPE: --local
        run: bash scripts/reset-production-d1.sh
      - name: Smoke-test Worker auth routes with local D1
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp .dev.vars.example .dev.vars
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/magic-folio-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          health=""
          for attempt in {1..30}; do
            health="$(curl --silent --show-error --fail --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/health 2>/dev/null || true)"
            if [[ -n "$health" ]]; then break; fi
            sleep 1
          done
          if [[ -z "$health" ]]; then
            cat /tmp/magic-folio-wrangler.log
            exit 1
          fi
          echo "$health" | jq -e '.ok == true and .service == "magic-folio"'
          state="$(curl --silent --show-error --fail --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/auth/state)"
          echo "$state" | jq -e '.needsSetup == true and .authenticated == false'
          register_status="$(curl --silent --output /tmp/register-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X POST http://localhost:8787/api/auth/register/options -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' --data '{}')"
          test "$register_status" = "403"
          login_status="$(curl --silent --output /tmp/login-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 -X POST http://localhost:8787/api/auth/login/options -H 'Origin: http://localhost:8787' -H 'Content-Type: application/json' --data '{}')"
          test "$login_status" = "403"
          private_status="$(curl --silent --output /tmp/credentials-response.json --write-out '%{http_code}' --resolve localhost:8787:127.0.0.1 http://localhost:8787/api/auth/credentials)"
          test "$private_status" = "401"
      - name: Validate Wrangler bundling and assets without deploying
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes wrangler@4 deploy --dry-run
