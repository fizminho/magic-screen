name: Generate npm lockfile

on:
  push:
    branches:
      - chore/ai-portfolio-rebuild
    paths:
      - "package.json"
      - ".github/workflows/generate-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: generate-npm-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Generate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to rebuild branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: generate reproducible npm lockfile"
          git push origin HEAD:chore/ai-portfolio-rebuild
